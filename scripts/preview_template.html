<title>动效全景 · __NAME__</title>
<style>
  :root{
    --ink:#f7f4ec; --panel:#ffffff; --panel2:#f1ece0; --line:#ded6c4;
    --text:#1c1a15; --dim:#6f6857; --gold:#a8842f; --goldsoft:#c9a24a;
    --shadow:0 1px 2px rgba(28,26,21,.06),0 8px 24px rgba(28,26,21,.06);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --ink:#0e0f13; --panel:#171a20; --panel2:#12141a; --line:#2a2e38;
    --text:#f0ebdd; --dim:#8d8778; --gold:#e6cf92; --goldsoft:#c9a24a;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --ink:#0e0f13; --panel:#171a20; --panel2:#12141a; --line:#2a2e38;
    --text:#f0ebdd; --dim:#8d8778; --gold:#e6cf92; --goldsoft:#c9a24a;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{background:var(--ink);color:var(--text);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px;padding-block:22px 64px}
  header h1{margin:0;font-size:clamp(25px,4.6vw,38px);font-weight:800;letter-spacing:.5px;text-wrap:balance}
  .sub{margin-top:7px;color:var(--dim);font-size:14.5px;line-height:1.65}
  .stats{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .stat b{display:block;font-size:24px;font-weight:800;color:var(--gold);letter-spacing:.5px}
  .stat span{font-size:12px;color:var(--dim);letter-spacing:1.4px}
  .ruler{margin-top:26px}
  .ruler .bar{position:relative;height:56px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .ruler .gap{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(208,74,59,.22) 0 6px,transparent 6px 12px)}
  .ruler .m60{position:absolute;top:0;bottom:0;width:2px;background:var(--goldsoft);opacity:.7}
  .ruler .tick{position:absolute;top:8px;bottom:8px;width:5px;border-radius:3px;border:none;padding:0;cursor:pointer}
  .ruler .tick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .ruler .marks{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--dim)}
  .hint{margin-top:9px;font-size:12.5px;color:var(--dim)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 18px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;
    padding:7px 15px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .chip[aria-pressed="true"]{border-color:var(--goldsoft);box-shadow:inset 0 0 0 1px var(--goldsoft)}
  .chip i{width:9px;height:9px;border-radius:50%;display:block}
  .grid{display:grid;gap:18px;grid-template-columns:1fr}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
  @media(min-width:1000px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column;padding:0;text-align:left;cursor:zoom-in;color:inherit;font:inherit}
  .card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .thumb{position:relative;aspect-ratio:16/9;background:#000;max-width:100%}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .tcbadge{position:absolute;left:9px;top:9px;background:rgba(10,11,15,.82);color:#f0ebdd;
    font-size:12.5px;padding:4px 9px;border-radius:6px;letter-spacing:.5px}
  .meta{padding:13px 14px 15px;display:flex;flex-direction:column;gap:7px}
  .kind{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:1.3px;color:var(--dim)}
  .kind i{width:9px;height:9px;border-radius:50%;display:block}
  .name{font-size:15px;font-weight:600;line-height:1.45}
  dialog{border:none;padding:0;max-width:min(1500px,96vw);width:100%;background:transparent}
  dialog::backdrop{background:rgba(6,7,10,.92)}
  .shot{width:100%;border-radius:10px;display:block}
  .bar2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;color:#f0ebdd;flex-wrap:wrap}
  .bar2 .nm{font-size:15px}
  .navb{display:flex;gap:8px}
  .navb button{background:rgba(255,255,255,.1);color:#f0ebdd;border:1px solid rgba(255,255,255,.22);
    border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer}
  @media (prefers-reduced-motion:no-preference){.card{transition:transform .16s ease}.card:hover{transform:translateY(-2px)}}
</style>

<div class="wrap">
  <header>
    <h1>动效全景 · __NAME__</h1>
    <p class="sub">成片里每一处图形时刻，按时间顺序排开，都是从当前版本里抽的真实帧。<br>
    密度条上的空白就是没有图形的段落；点卡片看大图。<b>确认没问题我再开渲。</b></p>
    <div class="stats">
      <div class="stat"><b class="mono" id="s1"></b><span>成片时长</span></div>
      <div class="stat"><b class="mono" id="s2"></b><span>图形时刻</span></div>
      <div class="stat"><b class="mono" id="s3"></b><span>图形覆盖</span></div>
      <div class="stat"><b class="mono" id="s4"></b><span>全屏板</span></div>
      <div class="stat"><b class="mono" id="s5"></b><span>效果档位</span></div>
      <div class="stat"><b class="mono" id="s6"></b><span>前 60 秒空档</span></div>
    </div>
  </header>

  <section class="ruler">
    <div class="bar" id="bar"></div>
    <div class="marks mono" id="marks"></div>
    <p class="hint">点密度条上的刻度可直接跳到那一帧；红色斜纹 = 前 60 秒里没有图形的空档，金线 = 第 60 秒</p>
  </section>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</div>

<dialog id="lb">
  <img class="shot" id="lbimg" alt="">
  <div class="bar2">
    <span class="nm mono" id="lbnm"></span>
    <span class="navb">
      <button type="button" id="prev">← 上一处</button>
      <button type="button" id="next">下一处 →</button>
      <button type="button" id="close">关闭</button>
    </span>
  </div>
</dialog>

<script>
const D = __DATA__;
const grid = document.getElementById('grid');
const bar = document.getElementById('bar');
const filters = document.getElementById('filters');
document.getElementById('s1').textContent = D.dur_tc;
document.getElementById('s2').textContent = D.items.length;
document.getElementById('s3').textContent = D.cov + '%';
document.getElementById('s4').textContent = D.boards;
document.getElementById('s5').textContent = D.tier;
document.getElementById('s6').textContent = D.gaps60.length ? D.gaps60.length + ' 处' : '0';
D.gaps60.forEach(([a, b]) => {
  const g = document.createElement('div'); g.className = 'gap';
  g.style.left = (a / D.dur * 100) + '%'; g.style.width = ((b - a) / D.dur * 100) + '%';
  g.title = '没有图形：' + a + '–' + b + 's'; bar.appendChild(g);
});
const m60 = document.createElement('div'); m60.className = 'm60'; m60.style.left = (60 / D.dur * 100) + '%'; bar.appendChild(m60);
const marks = document.getElementById('marks');
for (let m = 0; m <= Math.floor(D.dur / 60); m++) {
  const sp = document.createElement('span'); sp.textContent = m + ':00'; marks.appendChild(sp);
}
const endm = document.createElement('span');
endm.textContent = D.dur_tc; marks.appendChild(endm);

let off = new Set();
D.kinds.forEach(k => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', 'true');
  b.innerHTML = '<i style="background:' + k.c + '"></i>' + k.n;
  b.onclick = () => {
    const on = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', on ? 'false' : 'true');
    on ? off.add(k.n) : off.delete(k.n);
    render();
  };
  filters.appendChild(b);
});
D.items.forEach((it, i) => {
  const t = document.createElement('button');
  t.type = 'button'; t.className = 'tick'; t.title = it.tc + ' ' + it.label;
  t.style.left = (it.t / D.dur * 100) + '%';
  t.style.background = it.color;
  t.onclick = () => open(i);
  bar.appendChild(t);
});
function render() {
  grid.innerHTML = '';
  D.items.forEach((it, i) => {
    if (off.has(it.base)) return;
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'card';
    c.innerHTML =
      '<div class="thumb"><img src="' + it.src + '" alt="' + it.label + '" loading="lazy">' +
      '<span class="tcbadge mono">' + it.tc + '</span></div>' +
      '<div class="meta"><span class="kind"><i style="background:' + it.color + '"></i>' + it.kind + '</span>' +
      '<span class="name">' + it.label + '</span></div>';
    c.onclick = () => open(i);
    grid.appendChild(c);
  });
}
const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'), lbnm = document.getElementById('lbnm');
let cur = 0;
function open(i) {
  cur = (i + D.items.length) % D.items.length;
  const it = D.items[cur];
  lbimg.src = it.src; lbimg.alt = it.label;
  lbnm.textContent = it.tc + '  ·  ' + it.label;
  if (!lb.open) lb.showModal();
}
document.getElementById('prev').onclick = () => open(cur - 1);
document.getElementById('next').onclick = () => open(cur + 1);
document.getElementById('close').onclick = () => lb.close();
lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });
document.addEventListener('keydown', e => {
  if (!lb.open) return;
  if (e.key === 'ArrowLeft') open(cur - 1);
  if (e.key === 'ArrowRight') open(cur + 1);
});
render();
</script>
